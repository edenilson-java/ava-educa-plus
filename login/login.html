<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AVA-EDUCA+</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/simbolo-ava-educa.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="./login.css">
    <script type="module" src="./login.js"></script>
  </head>
  <body class="login-page">
    <main class="login-main">
      <section class="login-card surface" aria-labelledby="login-title">
        <img class="login-logo" src="../assets/images/logo-ava-educa.svg" alt="AVA-EDUCA+">

        <div class="login-heading">
          <h1 id="login-title">Acesse sua conta</h1>
          <p>Entre com seus dados para acessar o ambiente.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="login-field">
            <label for="email">Email <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="email" name="email" type="email" autocomplete="username" required>
          </div>

          <div class="login-field">
            <label for="senha">Senha <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
          </div>

          <button class="button button--primary login-button" type="submit">Entrar</button>
          <a id="esqueceu-senha" class="forgot-password" href="#">Esqueceu sua senha?</a>
        </form>

        <p id="login-message" class="message" role="alert" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
